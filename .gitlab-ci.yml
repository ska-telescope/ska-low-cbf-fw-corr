stages:
  - lint
  - build
  - test
  - publish
  - integration
  - pages
  - integration
  - scan

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  VITIS_VERSION: "2022.2"
  GITLAB_PROJECT_ID: 38134197  # used in manual build (upload)
  XPFM: "/opt/xilinx/platforms/xilinx_u55c_gen3x16_xdma_3_202210_1/xilinx_u55c_gen3x16_xdma_3_202210_1.xpfm"
  RIVIERA_TARGET: "Riviera-PRO-2022.10-x64" # version for 2022.2

  PERSONALITY: "correlator"
  TARGET_ALVEO: "u55"
  # we escape the $ for BASEDIR to allow evaluation later
  CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_project.tcl"
  VIVADO_BUILD_BASE_DIR: "./build"
  PACKAGE_KRNL_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/src/scripts/package_kernel.tcl"
  GEN_XO_DIRECTORY: "$${BASEDIR}/designs/${PERSONALITY}/src/scripts"
  GEN_XO_SCRIPT_PATH: "$GEN_XO_DIRECTORY/gen_xo.tcl"
  VPP_SCRIPT_DIR: "designs/${PERSONALITY}/src/scripts/${TARGET_ALVEO}"
  EXTRA_VPP_ARGS: "--user_ip_repo_paths $${BASEDIR}/pub-timeslave/hw/cores"
  EXTRA_XSIM_DIR: "$${BASEDIR}/sim"  # set to "" downstream if no sim exists
  EXTRA_MODEL_DIR: "" #"low-cbf-model"  # used as path for artifacts from xsim job
  EXTRA_MATLAB_MODEL_DIR: "" #"$${BASEDIR}/${EXTRA_MODEL_DIR}/src_atomic"  # set to "" downstream to skip matlab job
  COMPARE_SIM_TO_MODEL: "FALSE" 
  MAIN_BUILD_TAG: "TRUE"
  EXTRA_VPP_BUILD_TAG: "VPP_builder"
  

include:
  # Alveo FPGA build common CI configuration
  # Note: GitLab includes always grab the latest.
  # This may not match the copy in our 'common' submodule!
  - project: 'ska-telescope/low-cbf/ska-low-cbf-fw-common'
    file: 'gitlab/build.yml'
    # ref: 'be7849284084167a22f50af6bb47017b25ac9a3e'
  - project: 'ska-telescope/low-cbf/ska-low-cbf-fw-common'
    file: 'gitlab/simulate.yml'
    # ref: 'b199d7c80292a5f42cbddd7f83b8d14c6daf350c'


  # SKA standard includes
  # RAW artefact handling
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/raw.gitlab-ci.yml'
  # Release management
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/release.gitlab-ci.yml'
  # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'
  # .post step finalisers eg: badges
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/finaliser.gitlab-ci.yml'

raw-build:
  # note: this is modifying a job imported from templates-repository!
  #
  # The imported job runs 'make raw-package-all', which tars up EVERY directory
  # under raw/ and drops the archives in build/raw. raw-publish then pushes each
  # of those archives to the CAR when the pipeline is for a tag.
  #   raw/ska-low-cbf-fw-corr-u55c
  #   raw/ska-low-cbf-fw-corr-v80
  #
  # A tag pipeline does NOT rebuild the firmware. That used to mean up to 24h of
  # v++ plus 12h of 'vivado compile v80' just to give this job something to
  # package, and it released a fresh, differently-routed build rather than the
  # one that was tested on main. Instead we ask the package registry for the
  # newest '-main.<sha>' package this project has published and repackage that
  # for the CAR. Note the tag has nothing to do with which build is chosen: a
  # tag is often cut on a commit main never built.
  #
  # See common/scripts/fetch_car_packages.sh - it fails the job if a required
  # platform has no package in that build, or if the V80 build failed timing.
  rules:
    # Only a tag pipeline uploads to the CAR, so there is nothing to do
    # otherwise. The imported job's rule was just 'exists: raw/**/*'.
    - if: $CI_COMMIT_TAG
      exists:
        - raw/**/*
  needs: []   # inputs come from the package registry, not from this pipeline
  variables:
    BUILD_STRING: "CI CAR Package. Pipeline ${CI_PIPELINE_ID} created at ${CI_PIPELINE_CREATED_AT}. Tag ${CI_COMMIT_TAG}. Commit ${CI_COMMIT_SHORT_SHA}."
  before_script:
    - common/scripts/fetch_car_packages.sh

raw-publish:
  # note: this is modifying a job imported from templates-repository!
  # Without an explicit 'needs', GitLab hands this job every artifact from
  # earlier stages. All it actually needs is raw-build's build/raw.
  needs:
    - job: raw-build
      artifacts: true

####################################################################################################################
### Tag pipelines must not rebuild
# raw-build now takes the release contents from the main-branch build's package,
# so rebuilding for a tag is pure waste (and would release bits nobody tested).
#
# These are copies of '.build_rules' and '.package_rules' from
# ska-low-cbf-fw-common's gitlab/build.yml with the '- if: $CI_COMMIT_TAG'
# clause turned into 'never'. They have to be copies: YAML anchors do not cross
# GitLab 'include:' boundaries, so '*build_rules' is not visible in this file.
# If the rules in common change, these need the same change.
.build_rules_no_tag: &build_rules_no_tag
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # tag - the CAR release comes from the main-branch build, see 'raw-build'
  - if: $CI_COMMIT_TAG
    when: never
  # merge request
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # 'build' keyword in commit title
  - if: $CI_COMMIT_TITLE =~ /build/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

.package_rules_no_tag: &package_rules_no_tag
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # tag - the CAR release comes from the main-branch build, see 'raw-build'
  - if: $CI_COMMIT_TAG
    when: never
  # merge request
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # 'build' keyword in commit title
  - if: $CI_COMMIT_TITLE =~ /build/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

# Overrides of jobs imported from ska-low-cbf-fw-common. 'rules' is replaced
# wholesale, everything else in those jobs is inherited unchanged.
package kernel:
  rules: *build_rules_no_tag

generate xo:
  rules: *build_rules_no_tag

v++:
  rules: *build_rules_no_tag

publish dev package:
  rules: *package_rules_no_tag

# Low PSI CI job creation rules
.low_psi_rules: &low_psi_rules
  # The prerequisite jobs will not exist if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # starting out with a manual (not required) job, for initial familiarity & debugging
  - when: manual
    allow_failure: true

################################################################################
.vitis_settings: &vitis_settings
  - source common/scripts/vitis_settings.sh

.args_settings: &args_settings
  - source common/scripts/args_settings.sh

.self_test: &self_test
  - common/scripts/self_test.sh
################################################################################

psi-low-test:
  stage: integration
  tags:
    - shell  # doesn't really need to be shell, just need to find an appropriate docker image
  rules:
    - *low_psi_rules
  needs:
    - job: publish dev package
      optional: true  # absent in tag pipelines (no rebuild on tag)
  variables:
    # GitLab ID for ska-telescope/low-cbf/ska-low-cbf-integration
    TRIGGER_PROJECT: 48248401
    TRIGGER_REF: main
  script:
    - source common/scripts/util.sh
    - VERSION=$(get_version .)
    - echo Base version $VERSION
    # append -main, -dev, or nothing
    - if [[ -n "$CI_COMMIT_TAG" ]]; then
        echo "Release";
      elif [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" && "$MAIN_BUILD_TAG" == "TRUE" ]]; then
        echo "Main branch";
        VERSION="${VERSION}-main.${CI_COMMIT_SHORT_SHA}";
      else
        echo "Dev branch";
        VERSION=${VERSION}-dev.${CI_COMMIT_SHORT_SHA};
      fi
    - echo Full version $VERSION
    # Note that when using CI_JOB_TOKEN to trigger pipelines, the triggering project
    # must be in the allow list of the triggered project.
    - curl --fail
      --request POST
      --form "token=${CI_JOB_TOKEN}"
      --form "ref=${TRIGGER_REF}"
      --form "variables\[CORR_FW_VERSION\]=${VERSION}"
      "${CI_API_V4_URL}/projects/${TRIGGER_PROJECT}/trigger/pipeline"

ska-low-cbf-fw-testing:
  stage: integration
  rules:
    - *low_psi_rules
  needs:
    - job: publish dev package
      optional: true  # absent in tag pipelines (no rebuild on tag)
  trigger:
    project: "ska-telescope/low-cbf/ska-low-cbf-fw-testing"
  variables:
    # version is actually something like "0.0.1-main.5a9cbb45" or "0.0.1-dev.b9faa971",
    # but inserting the main/dev string here is annoying. Hash alone should be ok
    CORR_FW_VERSION: ${CI_COMMIT_SHORT_SHA}
    CORR_FW_SOURCE: "gitlab"

####################################################################################################################
### V80 Build rules
# When to do a full build
.v80_build_rules: &v80_build_rules
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # merge request
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # tag - the CAR release comes from the main-branch build, see 'raw-build'
  - if: $CI_COMMIT_TAG
    when: never
  # 'build' keyword in commit title
  #- if: $CI_COMMIT_TITLE =~ /build/
  - if: $CI_COMMIT_TITLE =~ /v80_b/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

# When to push firmware to package registry
.package_rules_v80: &package_rules_v80
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # merge request - 
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # tag - the CAR release comes from the main-branch build, see 'raw-build'
  - if: $CI_COMMIT_TAG
    when: never
  # 'build' keyword in commit title
  #- if: $CI_COMMIT_TITLE =~ /build/
  - if: $CI_COMMIT_TITLE =~ /v80_b/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

# Reuse mode: a 'v80_reuse=<jobid>' keyword in the commit message tells the
# pipeline to skip the expensive Vivado compile and instead pull the build/
# artifact from a previous 'vivado compile v80' job (given by <jobid>).
.v80_reuse_skip: &v80_reuse_skip
  # Skip this job when a reuse job id has been supplied.
  - if: '$CI_COMMIT_MESSAGE =~ /v80_reuse=[0-9]+/'
    when: never

.v80_reuse_run: &v80_reuse_run
  # Run this job (on success) when a reuse job id has been supplied.
  - if: '$CI_COMMIT_MESSAGE =~ /v80_reuse=[0-9]+/'

### V80 CI jobs
create project v80:
  stage: .pre
  rules:
    # tag - nothing downstream of this runs on a tag any more (the CAR release
    # comes from the main-branch build), so do not spin up Vivado for it.
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  needs:
    - ARGS
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
    - $EXTRA_CREATE_PROJECT_TAG
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "correlator_v80" # used to choose design
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
  before_script:
    - *args_settings
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - common/scripts/create_project_v80.sh
  artifacts:
    paths:
      - build/

fpga lint v80:
  stage: lint
  rules:
    - if: '$CI_COMMIT_TITLE !~ /docs/ && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null && $CI_COMMIT_TITLE !~ /v80_b/'
  # allow this job to be cancelled if new pipeline comes along
  interruptible: true
  needs:
    - create project v80
  timeout: 2 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"    # project name based on general approach
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - common/scripts/lint_step_v80.sh

# STAGE 1 of the old 'build v80' job: the expensive Vivado HW compile.
# Its build/ artifact is retained for 90 days so a later pipeline can reuse it
# via the 'v80_reuse=<jobid>' commit keyword. Skipped entirely in reuse mode.
vivado compile v80:
  stage: build
  rules:
    - *v80_reuse_skip
    - *v80_build_rules
  # allow this job to be cancelled if new pipeline comes along
  interruptible: false
  allow_failure: true
  needs:
    - create project v80
  timeout: 12 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"    # project name based on general approach
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - pwd   # this should report the dir of the cloned repo in the runner
    # copy protected ip repos into structure for building
    - cd common/v80_infra
    - cp -R /home/gitlab-runner/iprepo .
    - cd ../..
    # back at repo root, run STAGE 1 only (Vivado HW compile).
    - ./run_v80_hw.sh
  artifacts:
    paths:
      - build/ARGS/py/correlator_v80/fpgamap_*.py
      - build/v80/v80_top.xsa
      - build/v80/v80_top.runs/impl_1/v80_top.pdi
      - build/v80/v80_top.runs/impl_1/v80_top.ltx
      - build/v80/v80_top.runs/impl_1/*.rpt
      - build/v80/v80_top.runs/impl_1/*.log
    expire_in: 90 days
    when: always

# STAGE 2 of the old 'build v80' job: FW + PDI assembly + packaging (fast).
# In normal mode it consumes build/ from 'vivado compile v80'. In reuse mode
# (v80_reuse=<jobid> in the commit) that job is skipped and this job fetches
# build/ from the referenced previous job instead.
assemble v80:
  stage: build
  rules:
    - *v80_reuse_run
    - *v80_build_rules
  interruptible: true
  allow_failure: true
  needs:
    - job: vivado compile v80
      artifacts: true
      optional: true   # absent in reuse mode
  timeout: 2 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    # Reuse mode: pull build/ from a previous 'vivado compile v80' job.
    - |
      REUSE_ID=$(echo "$CI_COMMIT_MESSAGE" | grep -oP 'v80_reuse=\K[0-9]+' || true)
      if [ -n "$REUSE_ID" ]; then
        common/scripts/fetch_hw_build.sh "$REUSE_ID"
      else
        echo "Normal mode: using build/ compiled by 'vivado compile v80' in this pipeline."
      fi
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    # STAGE 2 only (FW + PDI + package). No Vivado place & route here.
    - ./run_v80_rest.sh
  artifacts:
    paths:
      - output/
    when: always

publish v80 package:
  stage: publish
  rules:
    - *package_rules_v80
  needs:
    - job: assemble v80
  tags:
    - shell 
  variables:
    BUILD_STRING: "CI development build. Pipeline ${CI_PIPELINE_ID} created at ${CI_PIPELINE_CREATED_AT} on branch ${CI_COMMIT_BRANCH}. Commit ${CI_COMMIT_SHORT_SHA}."
    VITIS_VERSION: "2025.1"
  script:
    - common/scripts/package_firmware_v80.sh

####################################################################################################################
### V80 100G networking design
#
# A second V80 design built from designs/correlator_v80/create_v80_100g_design.tcl
# instead of create_v80_design.tcl, selected by the V80_DESIGN_TCL variable that
# create_v80.sh reads.
#
# It deliberately reuses build/v80 and the 'v80_top' project name, so the whole
# downstream flow - create_fw_project.sh, create_pdi.sh, run_v80_rest.sh,
# check_v80_artifacts.sh - is shared with the standard V80 chain and needs no
# changes. Each job gets its own workspace, so the two chains never collide on
# disk, and their artifacts are kept apart by 'needs'.
#
# Where they MUST differ is the package name. package_firmware_v80.sh builds
# '<personality>_<platform>_<version>...', so without V80_PLATFORM the 100G
# package would upload under exactly the same file name as the standard V80
# build and silently replace it in the registry.
#
# ARGS is shared: this design uses the same 'correlator_v80' kernel and fpgamap,
# so there is no separate register map to generate.
#
# Not wired up here: the 'v80_reuse=' artifact-reuse mode (keyed to the standard
# chain's job ids), the CAR release path, and fpga lint.

# When to build the 100G design. Same shape as .v80_build_rules, with its own
# keyword so the two chains can be triggered independently.
.v80_100g_build_rules: &v80_100g_build_rules
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # tag - releases come from the main-branch build, see 'raw-build'
  - if: $CI_COMMIT_TAG
    when: never
  # merge request
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # 'v80_100g_b' keyword in commit title, to build this chain on its own
  - if: $CI_COMMIT_TITLE =~ /v80_100g_b/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

.package_rules_v80_100g: &package_rules_v80_100g
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # merge request
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # tag - releases come from the main-branch build, see 'raw-build'
  - if: $CI_COMMIT_TAG
    when: never
  # 'v80_100g_b' keyword in commit title
  - if: $CI_COMMIT_TITLE =~ /v80_100g_b/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

# STAGE 1: the expensive Vivado HW compile for the 100G design.
# Needs 'ARGS' rather than a create-project job: create_v80.sh deletes and
# regenerates both build/ARGS and build/v80 itself, so a separate Vivado
# project-creation step would be thrown away.
vivado compile v80 100g:
  stage: build
  rules:
    - *v80_100g_build_rules
  interruptible: false
  allow_failure: true
  needs:
    - ARGS
  timeout: 12 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"    # project name based on general approach
    V80_DESIGN_TCL: "create_v80_100g_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - pwd
    # copy protected ip repos into structure for building
    - cd common/v80_infra
    - cp -R /home/gitlab-runner/iprepo .
    - cd ../..
    - ./run_v80_hw.sh
  artifacts:
    paths:
      - build/ARGS/py/correlator_v80/fpgamap_*.py
      - build/v80/v80_top.xsa
      - build/v80/v80_top.runs/impl_1/v80_top.pdi
      - build/v80/v80_top.runs/impl_1/v80_top.ltx
      - build/v80/v80_top.runs/impl_1/*.rpt
      - build/v80/v80_top.runs/impl_1/*.log
    expire_in: 90 days
    when: always

# STAGE 2: FW + PDI assembly + packaging for the 100G design.
assemble v80 100g:
  stage: build
  rules:
    - *v80_100g_build_rules
  interruptible: true
  allow_failure: true
  needs:
    - job: vivado compile v80 100g
      artifacts: true
  timeout: 2 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"
    V80_DESIGN_TCL: "create_v80_100g_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - ./run_v80_rest.sh
  artifacts:
    paths:
      - output/
    when: always

publish v80 100g package:
  stage: publish
  rules:
    - *package_rules_v80_100g
  needs:
    - job: assemble v80 100g
  tags:
    - shell
  variables:
    BUILD_STRING: "CI development build, V80 100G networking design. Pipeline ${CI_PIPELINE_ID} created at ${CI_PIPELINE_CREATED_AT} on branch ${CI_COMMIT_BRANCH}. Commit ${CI_COMMIT_SHORT_SHA}."
    VITIS_VERSION: "2025.1"
    # Distinguishes this from the standard V80 package. Without it both upload
    # as '<personality>_v80_<version>...' and the second overwrites the first.
    V80_PLATFORM: "v80_100g"
  script:
    - common/scripts/package_firmware_v80.sh

####################################################################################################################
### Integration Tests in Low PSI

.low_psi_rules: &low_psi_rules
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # merge request - could make test mandatory ?
  #- if: $CI_PIPELINE_SOURCE == "merge_request_event"
  #  when: always 
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

.low_psi_script: &low_psi_script
  - source common/scripts/util.sh
  - VERSION=$(get_version .)
  - echo Base version $VERSION
    # append -main, -dev, or nothing
  - if [[ -n "$CI_COMMIT_TAG" ]]; then
      echo "Release";
    elif [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" && "$MAIN_BUILD_TAG" == "TRUE" ]]; then
      echo "Main branch";
      VERSION="${VERSION}-main.${CI_COMMIT_SHORT_SHA}";
    else
      echo "Dev branch";
      VERSION=${VERSION}-dev.${CI_COMMIT_SHORT_SHA};
    fi
  - echo Full version $VERSION
    # Couldn't get CI_JOB_TOKEN to work, so using a pipeline trigger token
  - curl --fail
    --request POST
    --form "token=${INTEGRATION_TOKEN}"
    --form "ref=${TRIGGER_REF}"
    --form "variables\[CORR_FW_VERSION\]=${VERSION}"
    --form "variables\[CORR_FW_SOURCE\]=gitlab"
    --form "variables\[PROC_FPGA\]=${PROC_FPGA}"
    --form "variables\[PROC_SERVER\]=${PROC_SERVER}"
    --form "variables\[PYTEST_FILTER\]=${PYTEST_FILTER}"
    --form "variables\[PYTEST_MARKS\]=${PYTEST_MARKS}"
    --form "variables\[SKA_LOW_CBF_VERSION\]=${SKA_LOW_CBF_VERSION}"
    --form "variables\[SKA_LOW_CBF_PROC_VERSION\]=${SKA_LOW_CBF_PROC_VERSION}"
    --form "variables\[SKA_LOW_CBF_TANGO_CNIC_VERSION\]=${SKA_LOW_CBF_TANGO_CNIC_VERSION}"
    "${CI_API_V4_URL}/projects/${TRIGGER_PROJECT}/trigger/pipeline"

psi-low-u55c-test:
  stage: integration
  tags:
    - shell  # doesn't really need to be shell, just need to find an appropriate docker image
  rules:
    - *low_psi_rules
  needs:
    - job: publish dev package
      optional: true  # in case publish job doesn't exist in pipeline (e.g. docs only)
  variables:
    # GitLab ID for ska-telescope/low-cbf/ska-low-cbf-integration
    TRIGGER_PROJECT: 48248401
    TRIGGER_REF: main
    PROC_FPGA: u55c
    PROC_SERVER: psi-perentie1
    # exclude PTC 26 - the only "short" test that needs more than one FPGA
    PYTEST_FILTER: corr and not ptc26 and not test_processor_download_time
    PYTEST_MARKS: hardware_present and not long_test and not large_capture
  script: 
    - *low_psi_script

psi-low-v80-test:
  extends: psi-low-u55c-test
  needs:
    - job: publish v80 package
      optional: true  # in case publish job doesn't exist in pipeline (e.g. docs only)
  variables:
    PROC_FPGA: v80
    PROC_SERVER: seren

