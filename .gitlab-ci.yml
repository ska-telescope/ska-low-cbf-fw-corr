stages:
  - lint
  - build
  - test
  - publish
  - integration
  - pages
  - integration
  - scan

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  VITIS_VERSION: "2022.2"
  GITLAB_PROJECT_ID: 38134197  # used in manual build (upload)
  XPFM: "/opt/xilinx/platforms/xilinx_u55c_gen3x16_xdma_3_202210_1/xilinx_u55c_gen3x16_xdma_3_202210_1.xpfm"
  RIVIERA_TARGET: "Riviera-PRO-2022.10-x64" # version for 2022.2

  PERSONALITY: "correlator"
  TARGET_ALVEO: "u55"
  # we escape the $ for BASEDIR to allow evaluation later
  CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_project.tcl"
  VIVADO_BUILD_BASE_DIR: "./build"
  PACKAGE_KRNL_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/src/scripts/package_kernel.tcl"
  GEN_XO_DIRECTORY: "$${BASEDIR}/designs/${PERSONALITY}/src/scripts"
  GEN_XO_SCRIPT_PATH: "$GEN_XO_DIRECTORY/gen_xo.tcl"
  VPP_SCRIPT_DIR: "designs/${PERSONALITY}/src/scripts/${TARGET_ALVEO}"
  EXTRA_VPP_ARGS: "--user_ip_repo_paths $${BASEDIR}/pub-timeslave/hw/cores"
  EXTRA_XSIM_DIR: "$${BASEDIR}/sim"  # set to "" downstream if no sim exists
  EXTRA_MODEL_DIR: "" #"low-cbf-model"  # used as path for artifacts from xsim job
  EXTRA_MATLAB_MODEL_DIR: "" #"$${BASEDIR}/${EXTRA_MODEL_DIR}/src_atomic"  # set to "" downstream to skip matlab job
  COMPARE_SIM_TO_MODEL: "FALSE" 
  MAIN_BUILD_TAG: "TRUE"
  EXTRA_VPP_BUILD_TAG: "VPP_builder"
  

include:
  # Alveo FPGA build common CI configuration
  # Note: GitLab includes always grab the latest.
  # This may not match the copy in our 'common' submodule!
  - project: 'ska-telescope/low-cbf/ska-low-cbf-fw-common'
    file: 'gitlab/build.yml'
    # ref: 'b199d7c80292a5f42cbddd7f83b8d14c6daf350c'
  - project: 'ska-telescope/low-cbf/ska-low-cbf-fw-common'
    file: 'gitlab/simulate.yml'
    # ref: 'b199d7c80292a5f42cbddd7f83b8d14c6daf350c'


  # SKA standard includes
  # RAW artefact handling
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/raw.gitlab-ci.yml'
  # Release management
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/release.gitlab-ci.yml'
  # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'
  # .post step finalisers eg: badges
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/finaliser.gitlab-ci.yml'

raw-build:
  # note: this is modifying a job imported from templates-repository!
  needs:
    - job: v++
      optional: true  # v++ job doesn't always exist in pipeline
  variables:
    BUILD_STRING: "CI CAR Package. Pipeline ${CI_PIPELINE_ID} created at ${CI_PIPELINE_CREATED_AT}. Tag ${CI_COMMIT_TAG}. Commit ${CI_COMMIT_SHORT_SHA}."
  before_script:
    # we check if the build directory exists because v++ doesn't always run
    - if [ -d build ]; then source common/scripts/util.sh; prepare_package_files raw/ska-low-cbf-fw-corr-u55c "$BUILD_STRING"; fi;

# Low PSI CI job creation rules
.low_psi_rules: &low_psi_rules
  # The prerequisite jobs will not exist if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # starting out with a manual (not required) job, for initial familiarity & debugging
  - when: manual
    allow_failure: true

################################################################################
.vitis_settings: &vitis_settings
  - source common/scripts/vitis_settings.sh

.args_settings: &args_settings
  - source common/scripts/args_settings.sh

.self_test: &self_test
  - common/scripts/self_test.sh
################################################################################

psi-low-test:
  stage: integration
  tags:
    - shell  # doesn't really need to be shell, just need to find an appropriate docker image
  rules:
    - *low_psi_rules
  needs:
    - publish dev package
  variables:
    # GitLab ID for ska-telescope/low-cbf/ska-low-cbf-integration
    TRIGGER_PROJECT: 48248401
    TRIGGER_REF: main
  script:
    - source common/scripts/util.sh
    - VERSION=$(get_version .)
    - echo Base version $VERSION
    # append -main, -dev, or nothing
    - if [[ -n "$CI_COMMIT_TAG" ]]; then
        echo "Release";
      elif [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" && "$MAIN_BUILD_TAG" == "TRUE" ]]; then
        echo "Main branch";
        VERSION="${VERSION}-main.${CI_COMMIT_SHORT_SHA}";
      else
        echo "Dev branch";
        VERSION=${VERSION}-dev.${CI_COMMIT_SHORT_SHA};
      fi
    - echo Full version $VERSION
    # Note that when using CI_JOB_TOKEN to trigger pipelines, the triggering project
    # must be in the allow list of the triggered project.
    - curl --fail
      --request POST
      --form "token=${CI_JOB_TOKEN}"
      --form "ref=${TRIGGER_REF}"
      --form "variables\[CORR_FW_VERSION\]=${VERSION}"
      "${CI_API_V4_URL}/projects/${TRIGGER_PROJECT}/trigger/pipeline"

ska-low-cbf-fw-testing:
  stage: integration
  rules:
    - *low_psi_rules
  needs:
    - publish dev package
  trigger:
    project: "ska-telescope/low-cbf/ska-low-cbf-fw-testing"
  variables:
    # version is actually something like "0.0.1-main.5a9cbb45" or "0.0.1-dev.b9faa971",
    # but inserting the main/dev string here is annoying. Hash alone should be ok
    CORR_FW_VERSION: ${CI_COMMIT_SHORT_SHA}
    CORR_FW_SOURCE: "gitlab"

####################################################################################################################
### V80 Build rules
# When to do a full build
.v80_build_rules: &v80_build_rules
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # merge request
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # tag (so raw-publish has something to publish)
  - if: $CI_COMMIT_TAG
  # 'build' keyword in commit title
  #- if: $CI_COMMIT_TITLE =~ /build/
  - if: $CI_COMMIT_TITLE =~ /v80_b/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

# When to push firmware to package registry
.package_rules_v80: &package_rules_v80
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # merge request - 
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true
  # main branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # tag (so raw-publish has something to publish)
  - if: $CI_COMMIT_TAG
  # 'build' keyword in commit title
  #- if: $CI_COMMIT_TITLE =~ /build/
  - if: $CI_COMMIT_TITLE =~ /v80_b/
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

# Reuse mode: a 'v80_reuse=<jobid>' keyword in the commit message tells the
# pipeline to skip the expensive Vivado compile and instead pull the build/
# artifact from a previous 'vivado compile v80' job (given by <jobid>).
.v80_reuse_skip: &v80_reuse_skip
  # Skip this job when a reuse job id has been supplied.
  - if: '$CI_COMMIT_MESSAGE =~ /v80_reuse=[0-9]+/'
    when: never

.v80_reuse_run: &v80_reuse_run
  # Run this job (on success) when a reuse job id has been supplied.
  - if: '$CI_COMMIT_MESSAGE =~ /v80_reuse=[0-9]+/'

### V80 CI jobs
create project v80:
  stage: .pre
  needs:
    - ARGS
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
    - $EXTRA_CREATE_PROJECT_TAG
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "correlator_v80" # used to choose design
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
  before_script:
    - *args_settings
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - common/scripts/create_project_v80.sh
  artifacts:
    paths:
      - build/

fpga lint v80:
  stage: lint
  rules:
    - if: '$CI_COMMIT_TITLE !~ /docs/ && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null && $CI_COMMIT_TITLE !~ /v80_b/'
  # allow this job to be cancelled if new pipeline comes along
  interruptible: true
  needs:
    - create project v80
  timeout: 2 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"    # project name based on general approach
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - common/scripts/lint_step_v80.sh

# STAGE 1 of the old 'build v80' job: the expensive Vivado HW compile.
# Its build/ artifact is retained for 90 days so a later pipeline can reuse it
# via the 'v80_reuse=<jobid>' commit keyword. Skipped entirely in reuse mode.
vivado compile v80:
  stage: build
  rules:
    - *v80_reuse_skip
    - *v80_build_rules
  # allow this job to be cancelled if new pipeline comes along
  interruptible: false
  allow_failure: true
  # needs:
  #   - fpga lint v80
  timeout: 12 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"    # project name based on general approach
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    - pwd   # this should report the dir of the cloned repo in the runner
    # copy protected ip repos into structure for building
    - cd common/v80_infra
    - cp -R /home/gitlab-runner/iprepo .
    - cd ../..
    # back at repo root, run STAGE 1 only (Vivado HW compile).
    - ./run_v80_hw.sh
  artifacts:
    # Full build/ tree is required by the assemble step (needs the .xsa, not
    # just the bitstream). Narrow these paths if artifact storage is a concern.
    paths:
      - build/
    expire_in: 90 days
    when: always

# STAGE 2 of the old 'build v80' job: FW + PDI assembly + packaging (fast).
# In normal mode it consumes build/ from 'vivado compile v80'. In reuse mode
# (v80_reuse=<jobid> in the commit) that job is skipped and this job fetches
# build/ from the referenced previous job instead.
assemble v80:
  stage: build
  rules:
    - *v80_reuse_run
    - *v80_build_rules
  interruptible: true
  allow_failure: true
  needs:
    - job: vivado compile v80
      artifacts: true
      optional: true   # absent in reuse mode
  timeout: 2 hours
  variables:
    TARGET_ALVEO: "v80"
    VITIS_VERSION: "2025.1"
    VIVADO_VERSION_IN_USE: "2025.1"
    EXTRA_DEVELOPER_TAG: ""
    PERSONALITY: "v80_top"
    CREATE_PRJ_SCRIPT_PATH: "$${BASEDIR}/designs/${PERSONALITY}/create_v80_design.tcl"
    VIVADO_BUILD_BASE_DIR: "$${BASEDIR}/build/v80"
  tags:
    - v80
    - $EXTRA_DEVELOPER_TAG
  before_script:
    - *self_test
    # Reuse mode: pull build/ from a previous 'vivado compile v80' job.
    - |
      REUSE_ID=$(echo "$CI_COMMIT_MESSAGE" | grep -oP 'v80_reuse=\K[0-9]+' || true)
      if [ -n "$REUSE_ID" ]; then
        common/scripts/fetch_hw_build.sh "$REUSE_ID"
      else
        echo "Normal mode: using build/ compiled by 'vivado compile v80' in this pipeline."
      fi
    - source "${XILINX_PATH}/${VITIS_VERSION}/Vivado/settings64.sh"
  script:
    # STAGE 2 only (FW + PDI + package). No Vivado place & route here.
    - ./run_v80_rest.sh
  artifacts:
    paths:
      - output/
    when: always

publish v80 package:
  stage: publish
  rules:
    - *package_rules_v80
  needs:
    - job: assemble v80
  tags:
    - shell 
  variables:
    BUILD_STRING: "CI development build. Pipeline ${CI_PIPELINE_ID} created at ${CI_PIPELINE_CREATED_AT} on branch ${CI_COMMIT_BRANCH}. Commit ${CI_COMMIT_SHORT_SHA}."
    VITIS_VERSION: "2025.1"
  script:
    - common/scripts/package_firmware_v80.sh

####################################################################################################################
### Integration Tests in Low PSI

.low_psi_rules: &low_psi_rules
  # Do not build if 'docs' in commit title
  - if: ($CI_COMMIT_TITLE =~ /docs/)
    when: never
  # merge request - could make test mandatory ?
  #- if: $CI_PIPELINE_SOURCE == "merge_request_event"
  #  when: always 
  # default - allow manual trigger but don't require it for pipeline success
  - when: manual
    allow_failure: true

.low_psi_script: &low_psi_script
  - source common/scripts/util.sh
  - VERSION=$(get_version .)
  - echo Base version $VERSION
    # append -main, -dev, or nothing
  - if [[ -n "$CI_COMMIT_TAG" ]]; then
      echo "Release";
    elif [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" && "$MAIN_BUILD_TAG" == "TRUE" ]]; then
      echo "Main branch";
      VERSION="${VERSION}-main.${CI_COMMIT_SHORT_SHA}";
    else
      echo "Dev branch";
      VERSION=${VERSION}-dev.${CI_COMMIT_SHORT_SHA};
    fi
  - echo Full version $VERSION
    # Couldn't get CI_JOB_TOKEN to work, so using a pipeline trigger token
  - curl --fail
    --request POST
    --form "token=${INTEGRATION_TOKEN}"
    --form "ref=${TRIGGER_REF}"
    --form "variables\[CORR_FW_VERSION\]=${VERSION}"
    --form "variables\[CORR_FW_SOURCE\]=gitlab"
    --form "variables\[PROC_FPGA\]=${PROC_FPGA}"
    --form "variables\[PROC_SERVER\]=${PROC_SERVER}"
    --form "variables\[PYTEST_FILTER\]=${PYTEST_FILTER}"
    --form "variables\[PYTEST_MARKS\]=${PYTEST_MARKS}"
    --form "variables\[SKA_LOW_CBF_VERSION\]=${SKA_LOW_CBF_VERSION}"
    --form "variables\[SKA_LOW_CBF_PROC_VERSION\]=${SKA_LOW_CBF_PROC_VERSION}"
    --form "variables\[SKA_LOW_CBF_TANGO_CNIC_VERSION\]=${SKA_LOW_CBF_TANGO_CNIC_VERSION}"
    "${CI_API_V4_URL}/projects/${TRIGGER_PROJECT}/trigger/pipeline"

psi-low-u55c-test:
  stage: integration
  tags:
    - shell  # doesn't really need to be shell, just need to find an appropriate docker image
  rules:
    - *low_psi_rules
  needs:
    - job: publish dev package
      optional: true  # in case publish job doesn't exist in pipeline (e.g. docs only)
  variables:
    # GitLab ID for ska-telescope/low-cbf/ska-low-cbf-integration
    TRIGGER_PROJECT: 48248401
    TRIGGER_REF: main
    PROC_FPGA: u55c
    PROC_SERVER: psi-perentie1
    # exclude PTC 26 - the only "short" test that needs more than one FPGA
    PYTEST_FILTER: corr and not ptc26 and not test_processor_download_time
    PYTEST_MARKS: hardware_present and not long_test and not large_capture
  script: 
    - *low_psi_script

psi-low-v80-test:
  extends: psi-low-u55c-test
  needs:
    - job: publish v80 package
      optional: true  # in case publish job doesn't exist in pipeline (e.g. docs only)
  variables:
    PROC_FPGA: v80
    PROC_SERVER: seren

