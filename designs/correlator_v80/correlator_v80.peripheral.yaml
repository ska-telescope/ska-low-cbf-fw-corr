              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Write Data bursts to HBM interface. Valid + Last"
          #################################
          - - field_name        : hbm_4_status_4
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Current levels of CDC FIFOs
                                   5 -> 0   = Read path rd count
                                   13 -> 8  = Write path wr count

                                   Other bits currently zeroed out.
                                   "
          #################################
          - - field_name        : hbm_5_status_0
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Read Requests to HBM interface"
          #################################
          - - field_name        : hbm_5_status_1
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Read Returns from HBM interface"
          #################################
          - - field_name        : hbm_5_status_2
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Write Address instructions to HBM interface"
          #################################
          - - field_name        : hbm_5_status_3
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Write Data bursts to HBM interface. Valid + Last"
          #################################
          - - field_name        : hbm_5_status_4
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Current levels of CDC FIFOs
                                   5 -> 0   = Read path rd count
                                   13 -> 8  = Write path wr count

                                   Other bits currently zeroed out.
                                   "
          #################################
          - - field_name        : sps_monitor_exists
              width             : 1 
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Indicates the existence of the sps monitor module, which writes SPS packet analysis data to HBM"
          #################################
          - - field_name        : sps_monitor_period
              width             : 16
              access_mode       : RW
              reset_value       : 0x2710
              field_description : "Configured time interval for dumping SPS monitoring data to the HBM. Units are milliseconds. Default is 10000 ms = 10s"
          #################################
          - - field_name        : sps_monitor_time_since_write
              width             : 16
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Number of milliseconds since last HBM write from the SPS statistics module. This will count from 0 up to sps_monitor_period"
          #################################
          - - field_name        : sps_monitor_dbg
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "AXI write channel activity counters for the SPS statistics write to HBM. Both counters wrap at 16 bits and are cleared only by reset.

                                 bits 15 -> 0  = Number of write address (aw) transactions accepted by the HBM interface

                                 bits 31 -> 16 = Number of data words accepted on the wdata bus (wvalid and wready)

                                 One complete dump of the statistics is 256 kBytes, sent as 256 bursts of 1024 bytes. So a complete dump advances the aw count by 256, and the wdata count by 8192 (256 bit wide bus, 32 beats per burst).

                                 If the aw count advances but the wdata count does not, the statistics module has requested the write but has not produced any data to go with it. Check sps_monitor_dbg5, sps_monitor_dbg3 and sps_monitor_dbg4 in that order.
                                 "
          - - field_name        : sps_monitor_dbg2
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "State of the AXI write channel in stats_hbm_write.

                                 bits 2 -> 0   = aw_fsm : 0 = set_aw, 1 = wait_aw, 2 = next_addr, 3 = wait_done0, 4 = wait_done1, 5 = done (idle)

                                 bits 14 -> 3  = to_send_count : number of aw transactions still to be sent. Loaded with 256 when a dump is triggered, and counts down to 0 as each aw transaction is sent.

                                 bit  15       = Write data FIFO empty, on the HBM clock side. '1' means there is no write data available to send.

                                 bit  16       = awvalid

                                 bit  17       = awready

                                 bit  18       = wvalid

                                 bit  19       = wready

                                 bits 27 -> 20 = Number of bursts completed, i.e. wlast accepted. Wraps at 8 bits, so this reads 0 after a whole number of complete dumps.

                                 bits 31 -> 28 = Number of HBM dump triggers seen on the HBM clock. Wraps at 4 bits.

                                 A stall shows up here as to_send_count non-zero with awvalid high and awready low, i.e. the NoC has stopped accepting write address transactions.
                                 "
          - - field_name        : sps_monitor_dbg3
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "State of the stats_summary module, which merges the per-packet summaries into the main table. Captured on the 425 MHz data clock and brought across to the HBM clock for reading.

                                 bits 2 -> 0   = hbm_dump_fsm : 0 = idle, 1 = wait_idle, 2 = trigger_HBM_write, 3 = wait_HBM_done0, 4 = wait_HBM_done1

                                 bits 5 -> 3   = input_fsm : 0 = idle, 1 = isort_table0_start, 2 = isort_table0, 3 = isort_table0_done, 4 = isort_table1_start, 5 = isort_table1, 6 = isort_table1_done, 7 = isort_done

                                 bits 8 -> 6   = merge_fsm : 0 = idle, 1 = run_merge_start0, 2 = run_merge_start1, 3 = run_merge_start2, 4 = run_merge, 5 = merge_done

                                 bit  9        = msort_running : the merge sort in stats_msort is busy

                                 bit  10       = wr_to_HBM_busy : stats_msort is busy copying the main table out to the HBM

                                 bit  11       = table_select : which insertion sort table incoming packets are being written to

                                 bits 18 -> 12 = isort_table0_entries : number of entries in insertion sort table 0 (0 to 64)

                                 bits 25 -> 19 = isort_table1_entries : number of entries in insertion sort table 1 (0 to 64)

                                 bit  26       = table_merge : which insertion sort table the merge sort is reading from

                                 bits 31 -> 27 = Unused, reads as 0

                                 A dump cannot start until hbm_dump_fsm leaves wait_idle, which requires input_fsm = idle, merge_fsm = idle, msort_running = 0 and both isort table entry counts = 0. If hbm_dump_fsm stays at 1 (wait_idle) then the sort has not finished and no write data will be produced. The usual suspect is msort_running stuck at 1, so read sps_monitor_dbg4 next.
                                 "
          - - field_name        : sps_monitor_dbg4
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "State of the stats_msort module, which does the merge sort and the copy of the main table out to the HBM. Captured on the 425 MHz data clock and brought across to the HBM clock for reading.

                                 bits 3 -> 0   = merge_fsm : 0 = idle, 1 = copy_to_HBM_start, 2 = copy_to_HBM, 3 = copy_to_HBM_pause, 4 = copy_to_HBM_done, 5 = wait_start0, 6 = wait_start1, 7 = run_merge, 8 = done

                                 bits 5 -> 4   = rd_mem0_fsm : 0 = idle, 1 = rd_data, 2 = wait_fifo, 3 = done

                                 bits 9 -> 6   = rd_mem1_fsm : 0 = idle, 1 = rd_data, 2 = wait_fifo, 3 = done, 4 = wait_done0, 5 = wait_done1, 6 = wait_done2, 7 = wait_done3, 8 = wait_done

                                 bit  10       = mem0_fifo_empty : the insertion sort table read FIFO is empty

                                 bit  11       = mem1_fifo_empty : the main reference table read FIFO is empty

                                 bit  12       = running : the value driven back to stats_summary as msort_running. This is 0 only when rd_mem0_fsm, rd_mem1_fsm and merge_fsm are all idle and both FIFOs are empty.

                                 bit  13       = hbm_busy : merge_fsm is not idle

                                 bits 26 -> 14 = mem1_entries : number of station and channel entries in the main reference table (0 to 8128)

                                 bits 31 -> 27 = Top 5 bits of main_table_rd_addr, i.e. the progress of the copy out to the HBM. Multiply by 256 to get the entry number, range 0 to 8191.

                                 If bit 12 is stuck at 1 with merge_fsm = 7 (run_merge) or a FIFO empty flag at 0, the merge sort has not drained and stats_summary will never leave wait_idle.
                                 "
          - - field_name        : sps_monitor_dbg5
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Data production counters from the 425 MHz data clock side, brought across to the HBM clock for reading. Both counters wrap at 16 bits and are cleared only by reset.

                                 bits 15 -> 0  = Number of 256 bit words produced by stats_summary, i.e. words pushed into the write data FIFO. A complete dump produces 8192 words.

                                 bits 31 -> 16 = Number of HBM dump triggers generated. This increments once every sps_monitor_period milliseconds.

                                 This is the first register to read when the statistics write stalls. If the dump trigger count is incrementing but the word count is not, the sort never released any data and the fault is upstream, in sps_monitor_dbg3 and sps_monitor_dbg4. If the word count is advancing but the wdata count in sps_monitor_dbg is not, the data is stuck between the FIFO and the NoC.
                                 "            
          - - field_name        : sps_monitor_wr_addr
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Most recent write address in HBM for the SPS statistics. \
                                   Units of bytes, within the SPS statistics HBM block. \
                                   Each SPS statistics block is 256 kBytes, so this address will step by 256k at the completion of writing the SPS statistics \
                                   Within each 256 kByte block, there are 8192 blocks of 32 bytes. \
                                   Each 32 bytes consists of \
                                   4 bytes metadata, classifying the packet by station, subarray, beam, and channel, defined as per the virtual channel table \
                                    Then, for all packets with the stated meta information, \
                                     3 bytes first polarisations sum of RMS values across all recorded packets \
                                     1 byte first polarisation minimum RMS value \
                                     1 byte first polarisation maximum RMS value \
                                     3 bytes second polarisation sum of RMS values across all recorded packets \
                                     1 byte second polarisation minimum RMS value \
                                     1 byte second polarisation maximum RMS value \
                                     2 bytes Number of packets recorded \
                                     4 bytes total number of samples marked as RFI \
                                     2 bytes number of packets with RMS in the range 0 to 3 \
                                     2 bytes number of packets with RMS in the range 4 to 11 \
                                     2 bytes number of packets with RMS in the range 12 to 31 \
                                     2 bytes number of packets with RMS in the range 32 to 63 \
                                     2 bytes number of packets with RMS in the range 64 to 127 \
                                     2 bytes low 16 bits of the packet count value for the first packet recorded with this meta data "
