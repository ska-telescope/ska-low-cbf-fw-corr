              access_mode       : RO
              reset_value       : 0x0
              field_description : "Current levels of CDC FIFOs
                                   5 -> 0   = Read path rd count
                                   13 -> 8  = Write path wr count

                                   Other bits currently zeroed out.
                                   "
          #################################
          - - field_name        : hbm_3_status_0
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Read Requests to HBM interface"
          #################################
          - - field_name        : hbm_3_status_1
              width             : 32
