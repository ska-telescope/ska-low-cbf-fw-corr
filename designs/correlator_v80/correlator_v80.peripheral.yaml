          #################################
          - - field_name        : packets_two_vlan_tag
              width             : 32
              access_mode       : RO
              reset_value       : 0x0
              field_description : "Total packets passed through axi converter with two vlan tag, it is then dropped before going to LFAA input."
          #################################
          - - field_name        : hbm_1_status_0
              width             : 32
